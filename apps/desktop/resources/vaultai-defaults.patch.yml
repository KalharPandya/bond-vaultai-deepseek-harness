# VaultAI deployment defaults for this build.
#
# This file is the whole VaultAI configuration. It is applied as an overlay
# patch after every bundle layer and both user layers, which is what lets the
# fork rebase onto a new upstream release without touching `dsh-base` or
# `dsh-web-app`: upstream never edits a file it does not have, so this one
# cannot conflict.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.
#
# No API key lives here. `apiKeyEnv` names a credential that the
# `credentials-local` row resolves per request from the process environment,
# `$DSH_HOME/.credentials.yaml`, or a project/user `.env`. Supply it there, or
# through the Models page in the application, which writes the managed
# credential document.
#
# Users still override these defaults: the `llm-pi-ai:` section of
# `$DSH_HOME/settings.yaml` merges per provider over this base, and that
# document is exactly what the Models page writes.

# The pi-ai adapter is mounted dormant by the shared base and registers routes
# the moment a profile supplies them. This is that supply: one OpenAI-compatible
# route at the VaultAI gateway.
- id: llm-pi-ai
  config:
    # Northwest Harness ships vaultai as first-party, wired directly to the local GMKtec gateway.
    firstPartyProviders: [vaultai]
    providers:
      vaultai:
        displayName: Northwest Harness
        api: openai-completions
        baseURL: http://vaultai.local/v1
        apiKeyEnv: VAULTAI_API_KEY
        headers:
          X-VaultAI-Reasoning: preserve
        cacheRetention: long
        defaultContextWindow: 65536
        defaultMaxTokens: 16384
        reasoning: medium
        compat:
          supportsUsageInStreaming: true
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          requiresReasoningContentOnAssistantMessages: true
          supportsLongCacheRetention: true
        models:
          - id: Qwen3.8-27B-Gufo
            name: Qwen 3.8 27B Gufo (Primary)
            input: [text, image]
            contextWindow: 65536
            maxTokens: 16384
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
          - id: Qwen3.8-27B-GGUF
            name: Qwen 3.8 27B GGUF (Concurrent)
            input: [text, image]
            contextWindow: 65536
            maxTokens: 16384
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
          - id: qwen3.6-35b-a3b
            name: Qwen 3.6 35B-A3B (Fast MoE)
            input: [text, image]
            contextWindow: 65536
            maxTokens: 16384
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
          - id: gpt-oss-20b
            name: GPT-OSS 20B (Ultra-Fast)
            input: [text]
            contextWindow: 65536
            maxTokens: 16384
            reasoningEfforts:
              off:
              low: low
              medium: medium
              high: high
          - id: Qwen3.8-27B-ROCmFP4-STRIX-MTP
            name: Qwen 3.8 27B ROCm FP4
            input: [text, image]
            contextWindow: 32768
            maxTokens: 8192
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
          - id: nvidia-nemotron-3-nano-30b-a3b
            name: Nemotron 3 Nano 30B-A3B
            input: [text]
            contextWindow: 65536
            maxTokens: 16384
            reasoningEfforts:
              off:
              low: low
              medium: medium
              high: high
          - id: gpt-oss-120b-mxfp4
            name: GPT-OSS 120B MXFP4 (Heavy)
            input: [text]
            contextWindow: 32768
            maxTokens: 8192
            reasoningEfforts:
              off:
              low: low
              medium: medium
              high: high

# The transport-independent default for agents created by entry points.
- id: agent-default-model
  config:
    provider: vaultai
    model: Qwen3.8-27B-Gufo

# Remove the preconfigured DeepSeek provider from the Models page. This build
# ships VaultAI as its only default provider; users can still add their own.
- id: llm-deepseek
  disabled: true

# Remove the "powered by dsh" badge skill. It inserts a DeepSeek-logo badge that
# links to the upstream repository into user documents, which this build should
# not do.
- id: skill-badge
  disabled: true

# Make the assistant identify as VaultAI. The shared base emits a fixed
# "powered by DeepSeek Harness" identity line; disabling it and supplying the
# deployment persona prefix replaces that first line with the VaultAI identity.
# Done here, at the deployment layer, so the core system-prompt source and its
# snapshot fixtures stay untouched and upstream merges stay clean.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: 'You are an AI agent powered by Northwest Harness.'
